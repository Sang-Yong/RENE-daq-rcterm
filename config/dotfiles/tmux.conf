# ---------------------------------------------------------------------
#  ~/.tmux.conf
#
#  가장 중요한 줄은 맨 아래 default-terminal 이다.
#  이것이 없으면 tmux 는 pane 안 TERM 을 'screen' 으로 준다 -> 8색.
#  그 상태에서는 디렉터리 파랑이 터미널 팔레트의 4번(#12488b, 짙은 남색)으로
#  찍혀서 어두운 배경에서 읽을 수 없다. 256색을 켜야 밝은 색을 직접 고를 수 있다.
#
#  적용 :  tmux source-file ~/.tmux.conf
#          (돌고 있는 pane 은 죽지 않는다. 다만 TERM 은 새로 만든 pane 부터
#           바뀌므로, 기존 pane 은 다시 만들어야 256색이 적용된다.
#           DAQ 가 돌고 있는 pane 은 절대 다시 만들지 말 것.)
# ---------------------------------------------------------------------

# ---- 색 ----
set  -g  default-terminal "tmux-256color"
# 바깥 터미널이 24bit 색을 지원하면 그대로 통과시킨다
set  -ga terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# ---- 편집기 반응성 ----
#  기본 500ms 는 vim 에서 Esc 를 누른 뒤 눈에 띄게 굼뜨다
set  -sg escape-time 10
set  -g  focus-events on

# ---- 스크롤백 : 감시자 로그가 초당 한 줄씩 쌓인다 ----
set  -g  history-limit 50000

# ---- 창/pane 이름 ----
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  allow-rename off
setw -g  automatic-rename off

# ---- pane 테두리와 이름표 ----
#  경계선을 굵은 선(heavy)으로. 가는 선은 어두운 배경에서 잘 안 보인다.
set  -g  pane-border-lines heavy
set  -g  pane-border-status top
#  이름표 색 : 평소 밝은 하늘색(117), 활성 pane 은 밝은 연두색(155) + 굵게.
#  #[...] 안의 쉼표는 #, 로 escape 해야 한다.
set  -g  pane-border-format "#{?pane_active,#[fg=colour155#,bold],#[fg=colour117]} #{pane_title} "
set  -g  pane-border-style        "fg=colour117"
set  -g  pane-active-border-style "fg=colour155,bold"

# ---- 상태줄 ----
set  -g  status-interval 5
set  -g  status-style "bg=colour236,fg=colour253"
set  -g  status-left  "#[bg=colour117,fg=colour16,bold] #S #[default] "
set  -g  status-left-length 24
set  -g  status-right "#[fg=colour120]#(pgrep -x rcsupervisor >/dev/null && echo 'DAQ ●' || echo '#[fg=colour210]DAQ ○') #[fg=colour247]%Y-%m-%d %H:%M "
set  -g  status-right-length 60
setw -g  window-status-current-style "fg=colour117,bold"
setw -g  window-status-style         "fg=colour247"

# ---- 메시지 / 복사 모드 ----
set  -g  message-style "bg=colour117,fg=colour16,bold"
setw -g  mode-style    "bg=colour117,fg=colour16"
setw -g  mode-keys vi          # 복사 모드에서 vi 키

# ---- 편의 ----
bind r source-file ~/.tmux.conf \; display-message "tmux.conf 다시 읽음"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ---- pane 크기 조절 ----
#  대문자 H J K L 로 5칸씩. -r 이라 Ctrl-B 를 한 번만 누르고 연타할 수 있다.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
#  정해진 비율로 되돌린다 (Ctrl-B 다음 =)
#    좌우 5.5 : 4.5 / postrun 높이 = 왼쪽 열의 3/4
bind = run-shell "/home/frontend/DAQ/RENE-daq-rcterm/scripts/daq-layout.sh"

# ---- 마우스 ----
#  기본은 끔. 켜면 휠 스크롤과 pane 크기 조절이 되지만, 드래그 선택으로
#  복사하려면 Shift 를 눌러야 한다. 원하면 아래 주석을 풀 것.
# set -g mouse on
