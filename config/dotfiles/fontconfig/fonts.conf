<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  ~/.config/fontconfig/fonts.conf

  Hack 과 Cascadia Code 에는 한글 글리프가 없다. 그대로 두면 시스템 기본 대체 폰트인
  'Noto Sans CJK JP'(가변폭, 일본어판)가 잡혀서
    - 한글 열이 어긋나고 (터미널은 고정폭이어야 한다)
    - 자형이 일본어판이 된다
  이 저장소는 주석과 문서가 한글이므로 고정폭 한국어판을 명시적으로 앞세운다.

  지우려면 이 파일을 삭제하고  fc-cache -f  실행.
-->
<fontconfig>

  <!-- 한글 글리프가 없는 영문 전용 고정폭 폰트들 -->
  <match target="pattern">
    <test name="family" compare="contains"><string>Hack</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Cascadia</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>

  <!-- monospace 를 요청하면 Hack -> 한글은 Noto Sans Mono CJK KR 순서 -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Hack</string>
    </edit>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>

  <!-- 한글 문서에서 일본어판이 먼저 잡히는 것을 막는다 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>

</fontconfig>
